name: NFSMW PRE744 - career-only Catch-Up policy tests
on:
  push:
    branches: [feature/pre744-career-catchup]
  pull_request:
    paths:
      - 'nativo/experimental/usa_catchup/nfsmw_catchup_carreira*'
      - 'nativo/experimental/usa_catchup/tests/test_catchup_carreira_policy.cpp'
      - 'nativo/app/CMakeLists.txt'
      - '.github/workflows/pre744-career-catchup-policy.yml'
permissions:
  contents: read
jobs:
  pure-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run career isolation test
        run: |
          set -euo pipefail
          g++ -std=c++23 -Wall -Wextra -Werror -pedantic \
            nativo/experimental/usa_catchup/tests/test_catchup_carreira_policy.cpp -o "$RUNNER_TEMP/pre744_policy_test"
          "$RUNNER_TEMP/pre744_policy_test"
          echo 'PRE744_POLICY_PASSED=1' >> "$GITHUB_STEP_SUMMARY"
      - name: Syntax-check actual native hook against ReX SDK headers
        run: |
          set -euo pipefail
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq libfmt-dev libspdlog-dev libsimde-dev >/dev/null
          c++ -std=c++23 -fsyntax-only \
            -I nativo/sdk/include \
            nativo/experimental/usa_catchup/nfsmw_catchup_carreira.cpp
          echo 'PRE744_REAL_SDK_HOOK_SYNTAX_PASSED=1' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify source was registered once and feature is off by default
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path("nativo/experimental/usa_catchup")
          cmake=Path("nativo/app/CMakeLists.txt").read_text()
          hook=(root/"nfsmw_catchup_carreira.cpp").read_text()
          assert cmake.count("src/nfsmw_catchup_carreira.cpp")==0  # PAL stays untouched
          assert hook.count("REX_HOOK_RAW(sub_823328C0)")==1
          assert "REXCVAR_DEFINE_BOOL(nfsmw_sem_catchup_carreira, false" in hook
          assert "__imp__sub_823328C0(ctx, base);" in hook
          assert "ctx.r3.u64 = 0;" in hook
          assert "sub_82332898" not in hook
          assert "app_usa" in hook
          print("PRE744_STATIC_SOURCE_CHECK_PASSED")
          PY
