name: PRE730B trace processor v54
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/pre730b-processor.yml']
permissions:
  contents: read
jobs:
  processor:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Perfetto v54 release and select processor
        run: |
          curl -fsSL --retry 3 https://github.com/google/perfetto/releases/download/v54.0/linux-amd64.zip -o linux.zip
          echo '2066ad35f7f56baf622f88506ded9cc07e2bc569417e7cd22e057126c06da382  linux.zip' | sha256sum -c -
          unzip -j linux.zip '*trace_processor_shell' -d bin
          chmod +x bin/trace_processor_shell
          bin/trace_processor_shell --version
      - uses: actions/upload-artifact@v4
        with:
          name: perfetto-v54-processor
          path: bin/trace_processor_shell
          retention-days: 3
